[project]
name = "pilot-fish"
version = "0.0.1"
description = "A lightweight, zero-infrastructure python monitoring library that runs algongside your code. Tap functions to allow for custom telemetry."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "ShawnPatrick-Barhorst", email = "shawnpatrick.barhorst@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
fast = ["orjson"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/ShawnPatrick-Barhorst/pilot-fish"
